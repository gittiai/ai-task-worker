[project]
name = "ai-task-worker"
version = "0.1.0"
description = "An autonomous AI worker that turns a plain-English company task into completed, verified work."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-xai>=0.2",
    "playwright>=1.47",
    "pdfplumber>=0.11",
    "reportlab>=4.2",
    "streamlit>=1.38",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
]

[project.scripts]
worker = "worker.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker", "company_app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF019"]
ignore = ["E731"]
