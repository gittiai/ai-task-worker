<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Acme Ops{% endblock %}</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; background: #f4f5f7; color: #1d2330; }
  header { background: #1f3a5f; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; }
  header a { color: #cfe0ff; margin-left: 16px; text-decoration: none; }
  main { max-width: 960px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e3e6ea; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button, .btn { margin-top: 16px; padding: 8px 16px; background: #1f6feb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
  .errors { background: #ffe9e9; border: 1px solid #f5b5b5; padding: 8px 16px; border-radius: 6px; }
  .ok { background: #e6f7ea; border: 1px solid #a6dcb2; padding: 8px 16px; border-radius: 6px; }
  .tag { padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #e8eef7; }
  .tag.flagged { background: #ffe3c2; } .tag.paid { background: #d8f3dc; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #overlay .box { background: #fff; padding: 24px; border-radius: 8px; max-width: 420px; }
</style>
</head>
<body>
<header>
  <strong>Acme Ops — Finance</strong>
  <nav>{% if user %}{{ user }} <a href="/invoices">Invoices</a> <a href="/invoices/new">New invoice</a> <a href="/logout">Log out</a>{% endif %}</nav>
</header>
<main>{% block content %}{% endblock %}</main>
{% if chaos and user %}
<div id="overlay" role="dialog" aria-label="Announcement">
  <div class="box">
    <h3>Scheduled maintenance tonight</h3>
    <p>Acme Ops will be unavailable from 23:00 to 23:30 IST.</p>
    <button onclick="document.getElementById('overlay').remove()">Got it</button>
  </div>
</div>
{% endif %}
</body>
</html>
